<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Weekly Digest - View Online</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: white;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        .header p {
            opacity: 0.9;
            font-size: 0.9rem;
        }
        .pdf-container {
            width: 100%;
            height: calc(100vh - 80px);
            background: #2d2d44;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .fallback {
            display: none;
            text-align: center;
            padding: 60px 20px;
            color: #ccc;
        }
        .fallback a {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 35px;
            border-radius: 10px;
            text-decoration: none;
            margin-top: 20px;
            font-weight: 600;
        }
        .fallback a:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 AI Weekly Digest</h1>
        <p>Agentic AI Updates • Updated December 15, 2025</p>
    </div>

    <div class="pdf-container">
        <iframe src="AI_Weekly_2025-12-15.pdf#view=FitH" type="application/pdf"></iframe>
        <div class="fallback" id="fallback">
            <h2>View Presentation</h2>
            <p>Your browser doesn't support embedded PDFs.</p>
            <a href="AI_Weekly_2025-12-15.pdf" target="_blank">Open in New Tab →</a>
        </div>
    </div>

    <script>
        // Check if PDF can be displayed
        const iframe = document.querySelector('iframe');
        if (!iframe || !iframe.contentDocument) {
            setTimeout(() => {
                const fallback = document.getElementById('fallback');
                if (fallback) fallback.style.display = 'block';
            }, 1000);
        }
    </script>
</body>
</html>
